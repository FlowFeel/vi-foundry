# docker-compose.test.yml — The simulacrum stack
#
# The r-runtime installs the package from the mounted source, runs the
# simulacrum (parameter-recovery) and integration (end-to-end) testthat gates,
# and writes a success marker to the shared output volume on exit. Postgres is
# available so the data-integrity BDD scenario can run a real DB round-trip
# (set RUN_DB_INTEGRATION=true). The verifier waits for the r-runtime to
# complete, then checks the success marker.
#
# Read-only source mounts prevent accidental contamination. The writable
# output volume is shared between r-runtime and verifier.

services:
  r-runtime:
    build:
      context: ..
      dockerfile: docker/r-runtime/Dockerfile
    volumes:
      - ..:/workspace:ro
      - test-output:/workspace/output
    working_dir: /workspace
    command: >
      sh -c "
        R CMD INSTALL /workspace &&
        Rscript run_tests.R simulacra &&
        Rscript run_tests.R integration &&
        touch /workspace/output/success
      "
    environment:
      - R_LIBS_USER=/usr/local/lib/R/site-library
      - RUN_DB_INTEGRATION=true
      - PGHOST=postgres
      - PGPORT=5432
      - PGDATABASE=simulation_test
      - PGUSER=sim
      - PGPASSWORD=simulacrum
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sim-net

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: simulation_test
      POSTGRES_USER: sim
      POSTGRES_PASSWORD: simulacrum
    volumes:
      - ../tests/fixtures/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ../tests/fixtures/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
      - pg-test-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sim -d simulation_test"]
      interval: 5s
      retries: 20
      start_period: 10s
    networks:
      - sim-net

  verifier:
    build:
      context: ..
      dockerfile: docker/verifier/Dockerfile
    volumes:
      - test-output:/workspace/output:ro
    depends_on:
      r-runtime:
        condition: service_completed_successfully
    networks:
      - sim-net

volumes:
  test-output:
  pg-test-data:

networks:
  sim-net:
    driver: bridge
