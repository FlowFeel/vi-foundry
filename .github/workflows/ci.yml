name: VI Foundry CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

env:
  R_REPOS: "https://cloud.r-project.org/"

jobs:
  # ── Gate 1: Lint (static analysis) ──────────────────────────────
  lint:
    runs-on: ubuntu-latest
    container: rocker/r-ver:4.4.3
    steps:
      - uses: actions/checkout@v4

      - name: Install lintr and styler
        run: |
          R -e "install.packages(c('lintr','styler','roxygen2'), repos='${{ env.R_REPOS }}')"

      - name: Style check (warning only — don't fail CI on formatting)
        run: |
          Rscript -e "
            result <- styler::style_dir('R/', dry = 'warn')
            if (length(result$changed) > 0) {
              message('NOTE: ', length(result$changed), ' files need styling. Run styler::style_dir(\"R/\") locally.')
            } else {
              message('All files pass style check.')
            }
          "

      - name: Lint package
        run: Rscript -e "lintr::lint_package()"

  # ── Gate 2: Unit tests (pure logic, no Docker, fast) ────────────
  unit:
    runs-on: ubuntu-latest
    container: rocker/r-ver:4.4.3
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          apt-get update && apt-get install -y --no-install-recommends \
            libpq-dev libxml2-dev libcurl4-openssl-dev libssl-dev
          rm -rf /var/lib/apt/lists/*

      - name: Install R dependencies
        run: |
          R -e "install.packages(c(
            'testthat','withr','covr','mockery','R6','yaml','ggplot2',
            'roxygen2','readxl','knitr','rmarkdown'
          ), repos='${{ env.R_REPOS }}')"

      - name: Generate NAMESPACE with roxygen2
        run: Rscript -e "roxygen2::roxygenize('.', load_code=roxygen2::load_source)"

      - name: Install package
        run: R CMD INSTALL .

      - name: Run unit tests
        run: Rscript run_tests.R unit

      - name: Check coverage (≥ 80%)
        run: |
          Rscript -e "
            cov <- covr::package_coverage()
            pct <- covr::percent_coverage(cov)
            message('Coverage: ', round(pct, 2), '%')
            if (pct < 80) stop('Coverage below 80%: ', round(pct, 2), '%')
          "

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage-report.json
          retention-days: 7

  # ── Gate 3: Simulacra tests (STDD parameter recovery) ────────────
  simulacra:
    runs-on: ubuntu-latest
    container: rocker/r-ver:4.4.3
    needs: unit
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          apt-get update && apt-get install -y --no-install-recommends \
            libpq-dev libxml2-dev libcurl4-openssl-dev libssl-dev
          rm -rf /var/lib/apt/lists/*

      - name: Install R dependencies
        run: |
          R -e "install.packages(c(
            'testthat','withr','covr','R6','yaml','ggplot2',
            'roxygen2','readxl'
          ), repos='${{ env.R_REPOS }}')"

      - name: Generate NAMESPACE and install package
        run: |
          Rscript -e "roxygen2::roxygenize('.', load_code=roxygen2::load_source)"
          R CMD INSTALL .

      - name: Run simulacrum tests
        run: Rscript run_tests.R simulacra

      - name: Upload simulacra results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulacra-results
          path: results/
          retention-days: 30

  # ── Gate 4: Integration (Docker simulacrum + BDD) ───────────────
  integration:
    runs-on: ubuntu-latest
    needs: simulacra
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        run: pip install pyyaml

      - name: Build Docker simulacrum stack
        run: |
          docker compose -f compose/docker-compose.test.yml build

      - name: Run simulacrum stack
        run: |
          docker compose -f compose/docker-compose.test.yml up --abort-on-container-exit --exit-code-from verifier

      - name: Upload integration results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-results
          path: test-output/
          retention-days: 7

  # ── Gate 5: Regression (baseline oracle comparison) ─────────────
  regression:
    runs-on: ubuntu-latest
    needs: integration
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Download integration results
        uses: actions/download-artifact@v4
        with:
          name: integration-results
          path: test-output/

      - name: Compare results to baseline oracle
        run: |
          python tests/compare_baseline.py \
            --tolerance 0.001 \
            --baseline baseline \
            --output test-output

  # ── Gate 6: R CMD check (package validation) ─────────────────────
  check:
    runs-on: ubuntu-latest
    container: rocker/r-ver:4.4.3
    needs: regression
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          apt-get update && apt-get install -y --no-install-recommends \
            libpq-dev libxml2-dev libcurl4-openssl-dev libssl-dev
          rm -rf /var/lib/apt/lists/*

      - name: Install R package dependencies
        run: |
          R -e "install.packages(c(
            'testthat','withr','covr','lintr','styler','mockery',
            'R6','yaml','ggplot2','readxl','knitr','rmarkdown',
            'roxygen2','ape','caper','phytools','plumber','DBI','RPostgres'
          ), repos='${{ env.R_REPOS }}')"

      - name: Generate NAMESPACE and install
        run: |
          Rscript -e "roxygen2::roxygenize('.', load_code=roxygen2::load_source)"
          R CMD INSTALL .

      - name: R CMD check
        run: R CMD check --no-manual --no-build-vignettes .

      - name: Upload check results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r-cmd-check
          path: vi.foundry.Rcheck/
          retention-days: 7

  # ── Summary ──────────────────────────────────────────────────────
  summary:
    runs-on: ubuntu-latest
    needs: [lint, unit, simulacra, integration, regression, check]
    if: always()
    steps:
      - name: CI Summary
        run: |
          echo "## VI Foundry CI Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Gate | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint | ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Unit Tests | ${{ needs.unit.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Simulacra | ${{ needs.simulacra.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Integration | ${{ needs.integration.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Regression | ${{ needs.regression.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| R CMD Check | ${{ needs.check.result }} |" >> $GITHUB_STEP_SUMMARY
