name: VI Foundry CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  R_REPOS: "https://cloud.r-project.org/"

jobs:
  lint:
    runs-on: ubuntu-latest
    continue-on-error: true
    container: rocker/tidyverse:4.5.3
    steps:
      - uses: actions/checkout@v4
      - name: Install lintr
        run: R -e "install.packages(c('lintr', 'styler', 'roxygen2'), repos='${{ env.R_REPOS }}')"
      - name: Style check
        run: |
          Rscript -e "
            result <- tryCatch(
              styler::style_dir('R/', dry = 'warn'),
              error = function(e) { message('Styler error: ', e$message); NULL }
            )
            message('Style check complete')
          "
      - name: Lint package
        run: |
          Rscript -e "
            lints <- lintr::lint_package()
            if (length(lints) > 0) {
              print(lints)
              stop('Lint failed: ', length(lints), ' issues found')
            } else {
              message('No lint issues.')
            }
          "

  unit:
    runs-on: ubuntu-latest
    container: rocker/tidyverse:4.5.3
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          apt-get update && apt-get install -y --no-install-recommends libpq-dev
          rm -rf /var/lib/apt/lists/*
      - name: Install R dependencies
        run: |
          R -e "install.packages(c(
            'testthat','withr','covr','mockery','R6','yaml','ggplot2',
            'roxygen2','readxl','knitr','rmarkdown','patchwork','dplyr','viridis'
          ), repos='${{ env.R_REPOS }}')"
      - name: Generate NAMESPACE
        run: Rscript -e "roxygen2::roxygenize('.', load_code=roxygen2::load_source)"
      - name: Install package
        run: R CMD INSTALL .
      - name: Run unit tests
        run: Rscript run_tests.R unit
      - name: Check coverage
        run: |
          Rscript -e "
            cov <- covr::package_coverage()
            pct <- covr::percent_coverage(cov)
            message('Coverage: ', round(pct, 2), '%')
            if (pct < 80) stop('Coverage below 80%: ', round(pct, 2), '%')
          "
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage-report.json
          retention-days: 7

  simulacra:
    runs-on: ubuntu-latest
    container: rocker/tidyverse:4.5.3
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          apt-get update && apt-get install -y --no-install-recommends libpq-dev
          rm -rf /var/lib/apt/lists/*
      - name: Install R dependencies
        run: |
          R -e "install.packages(c(
            'testthat','withr','R6','yaml','ggplot2',
            'roxygen2','readxl','knitr','rmarkdown','patchwork','dplyr','viridis'
          ), repos='${{ env.R_REPOS }}')"
      - name: Generate NAMESPACE and install
        run: |
          Rscript -e "roxygen2::roxygenize('.', load_code=roxygen2::load_source)"
          R CMD INSTALL .
      - name: Run simulacra tests
        run: Rscript run_tests.R simulacra
      - name: Generate visualizations
        run: Rscript scripts/generate_viz.R
      - name: Upload simulacra results
        uses: actions/upload-artifact@v4
        with:
          name: simulacra-results
          path: results/
          retention-days: 7

  integration:
    runs-on: ubuntu-latest
    container: rocker/tidyverse:4.5.3
    needs: simulacra
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          apt-get update && apt-get install -y --no-install-recommends libpq-dev
          rm -rf /var/lib/apt/lists/*
      - name: Install R dependencies
        run: |
          R -e "install.packages(c(
            'testthat','withr','R6','yaml','ggplot2',
            'roxygen2','readxl','knitr','rmarkdown','patchwork','dplyr','viridis'
          ), repos='${{ env.R_REPOS }}')"
      - name: Generate NAMESPACE and install
        run: |
          Rscript -e "roxygen2::roxygenize('.', load_code=roxygen2::load_source)"
          R CMD INSTALL .
      - name: Run integration tests
        run: Rscript run_tests.R integration

  regression:
    runs-on: ubuntu-latest
    container: rocker/tidyverse:4.5.3
    needs: integration
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          apt-get update && apt-get install -y --no-install-recommends libpq-dev
          rm -rf /var/lib/apt/lists/*
      - name: Install R dependencies
        run: |
          R -e "install.packages(c(
            'testthat','withr','R6','yaml','ggplot2',
            'roxygen2','readxl','knitr','rmarkdown','patchwork','dplyr','viridis'
          ), repos='${{ env.R_REPOS }}')"
      - name: Generate NAMESPACE and install
        run: |
          Rscript -e "roxygen2::roxygenize('.', load_code=roxygen2::load_source)"
          R CMD INSTALL .
      - name: Run regression tests
        run: Rscript run_tests.R regression

  check:
    runs-on: ubuntu-latest
    container: rocker/tidyverse:4.5.3
    needs: regression
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          apt-get update && apt-get install -y --no-install-recommends libpq-dev
          rm -rf /var/lib/apt/lists/*
      - name: Install R dependencies
        run: |
          R -e "install.packages(c(
            'testthat','withr','R6','yaml','ggplot2',
            'roxygen2','readxl','knitr','rmarkdown','patchwork','dplyr','viridis'
          ), repos='${{ env.R_REPOS }}')"
      - name: Generate NAMESPACE and install
        run: |
          Rscript -e "roxygen2::roxygenize('.', load_code=roxygen2::load_source)"
          R CMD INSTALL .
      - name: R CMD check
        run: rcmdcheck::rcmdcheck(".", args = c("--no-manual", "--as-cran"))

  pages:
    runs-on: ubuntu-latest
    needs: [simulacra]
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Download simulacra results
        uses: actions/download-artifact@v4
        with:
          name: simulacra-results
          path: results/
      - name: Copy visualizations to docs
        run: |
          mkdir -p docs/simulacra
          cp results/simulacra/*.png docs/simulacra/ 2>/dev/null || true
          cp results/simulacra/*.pdf docs/simulacra/ 2>/dev/null || true
      - name: Build Pages artifact
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4

  summary:
    runs-on: ubuntu-latest
    needs: [lint, unit, simulacra, integration, regression, check, pages]
    if: always()
    steps:
      - run: |
          echo "## CI Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Gate | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint | ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Unit Tests | ${{ needs.unit.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Simulacra | ${{ needs.simulacra.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Integration | ${{ needs.integration.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Regression | ${{ needs.regression.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| R CMD Check | ${{ needs.check.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Pages Deploy | ${{ needs.pages.result }} |" >> $GITHUB_STEP_SUMMARY
