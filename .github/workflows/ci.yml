name: VI Foundry CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  R_REPOS: "https://cloud.r-project.org/"

jobs:
  lint:
    runs-on: ubuntu-latest
    container: rocker/r-ver:4.4.3
    steps:
      - uses: actions/checkout@v4
      - name: Install lintr and styler
        run: R -e "install.packages(c('lintr','styler','roxygen2'), repos='${{ env.R_REPOS }}')"
      - name: Style check
        run: |
          Rscript -e "
            result <- tryCatch(
              styler::style_dir('R/', dry = 'warn'),
              error = function(e) { message('Styler error: ', e$message); NULL }
            )
            message('Style check complete')
          "
      - name: Lint package
        run: Rscript -e "lintr::lint_package()"

  unit:
    runs-on: ubuntu-latest
    container: rocker/r-ver:4.4.3
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          apt-get update && apt-get install -y --no-install-recommends \
            libpq-dev libxml2-dev libcurl4-openssl-dev libssl-dev
          rm -rf /var/lib/apt/lists/*
      - name: Install R dependencies
        run: |
          R -e "install.packages(c(
            'testthat','withr','covr','mockery','R6','yaml','ggplot2',
            'roxygen2','readxl','knitr','rmarkdown','patchwork','dplyr','viridis'
          ), repos='${{ env.R_REPOS }}')"
      - name: Generate NAMESPACE
        run: Rscript -e "roxygen2::roxygenize('.', load_code=roxygen2::load_source)"
      - name: Install package
        run: R CMD INSTALL .
      - name: Run unit tests
        run: Rscript run_tests.R unit
      - name: Check coverage
        run: |
          Rscript -e "
            cov <- covr::package_coverage()
            pct <- covr::percent_coverage(cov)
            message('Coverage: ', round(pct, 2), '%')
            if (pct < 80) stop('Coverage below 80%: ', round(pct, 2), '%')
          "
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage-report.json
          retention-days: 7

  simulacra:
    runs-on: ubuntu-latest
    container: rocker/r-ver:4.4.3
    needs: unit
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          apt-get update && apt-get install -y --no-install-recommends \
            libpq-dev libxml2-dev libcurl4-openssl-dev libssl-dev
          rm -rf /var/lib/apt/lists/*
      - name: Install R dependencies
        run: |
          R -e "install.packages(c(
            'testthat','withr','covr','R6','yaml','ggplot2',
            'roxygen2','readxl','base64enc','patchwork','dplyr','viridis'
          ), repos='${{ env.R_REPOS }}')"
      - name: Generate NAMESPACE and install
        run: |
          Rscript -e "roxygen2::roxygenize('.', load_code=roxygen2::load_source)"
          R CMD INSTALL .
      - name: Run simulacrum tests
        run: Rscript run_tests.R simulacra
      - name: Generate visualizations
        run: |
          mkdir -p results/simulacra docs
          Rscript scripts/render_pages.R
      - name: Upload simulacra results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulacra-results
          path: results/
          retention-days: 30
      - name: Upload viz HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulacra-viz
          path: docs/
          retention-days: 30

  integration:
    runs-on: ubuntu-latest
    needs: simulacra
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Python dependencies
        run: pip install pyyaml
      - name: Build Docker simulacrum stack
        run: docker compose -f compose/docker-compose.test.yml build
      - name: Run simulacrum stack
        run: docker compose -f compose/docker-compose.test.yml up --abort-on-container-exit --exit-code-from verifier
      - name: Upload integration results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-results
          path: test-output/
          retention-days: 7

  regression:
    runs-on: ubuntu-latest
    needs: integration
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install pyyaml
      - name: Download integration results
        uses: actions/download-artifact@v4
        with:
          name: integration-results
          path: test-output/
      - name: Compare to baseline oracle
        run: |
          python tests/compare_baseline.py \
            --tolerance 0.001 \
            --baseline baseline \
            --output test-output

  check:
    runs-on: ubuntu-latest
    container: rocker/r-ver:4.4.3
    needs: regression
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          apt-get update && apt-get install -y --no-install-recommends \
            libpq-dev libxml2-dev libcurl4-openssl-dev libssl-dev
          rm -rf /var/lib/apt/lists/*
      - name: Install R dependencies
        run: |
          R -e "install.packages(c(
            'testthat','withr','covr','lintr','styler','mockery',
            'R6','yaml','ggplot2','readxl','knitr','rmarkdown',
            'roxygen2','ape','caper','phytools','plumber','DBI','RPostgres',
            'patchwork','dplyr','viridis','base64enc'
          ), repos='${{ env.R_REPOS }}')"
      - name: Generate NAMESPACE and install
        run: |
          Rscript -e "roxygen2::roxygenize('.', load_code=roxygen2::load_source)"
          R CMD INSTALL .
      - name: R CMD check
        run: R CMD check --no-manual --no-build-vignettes .
      - name: Upload check results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r-cmd-check
          path: vi.foundry.Rcheck/
          retention-days: 7

  pages:
    runs-on: ubuntu-latest
    needs: [simulacra]
    if: github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download viz HTML
        uses: actions/download-artifact@v4
        with:
          name: simulacra-viz
          path: site/
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  summary:
    runs-on: ubuntu-latest
    needs: [lint, unit, simulacra, integration, regression, check, pages]
    if: always()
    steps:
      - name: CI Summary
        run: |
          echo "## VI Foundry CI Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Gate | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint | ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Unit Tests | ${{ needs.unit.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Simulacra | ${{ needs.simulacra.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Integration | ${{ needs.integration.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Regression | ${{ needs.regression.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| R CMD Check | ${{ needs.check.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| GitHub Pages | ${{ needs.pages.result }} |" >> $GITHUB_STEP_SUMMARY
