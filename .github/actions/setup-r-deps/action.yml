name: Setup R dependencies
description: >-
  Install R system + package dependencies with a GitHub Actions cache.
  Designed for the rocker/tidyverse:4.5.3 container. Caches the site
  library so the ~23-package install (normally 6+ min) runs once and is
  reused by every subsequent job in the sequential CI chain.

runs:
  using: composite

  steps:
    # System deps — libpq-dev for RPostgres/DBI. Fast (~10s); not cached.
    - name: Install system dependencies
      shell: bash
      run: |
        apt-get update && apt-get install -y --no-install-recommends libpq-dev
        rm -rf /var/lib/apt/lists/*

    # Cache the R site library. Keyed on the container tag + a hash of this
    # file, so changing the package list below automatically invalidates the
    # cache. restore-keys lets a new key fall back to the nearest previous
    # cache and install only the diff.
    #
    # The jobs are sequential (lint -> unit -> simulacra -> ... -> check),
    # so the first job (lint) populates the cache and every subsequent job
    # gets a hit. The site library includes rocker's pre-installed packages
    # (tidyverse etc.) plus our additions; caching the whole directory is
    # fine within GitHub's 10 GB limit.
    - name: Cache R library
      uses: actions/cache@v4
      with:
        path: /usr/local/lib/R/site-library
        key: r-deps-rocker-4.5.3-${{ hashFiles('.github/actions/setup-r-deps/action.yml') }}
        restore-keys: |
          r-deps-rocker-4.5.3-

    # Comprehensive package list (union of all jobs' needs). The
    # installed.packages() diff means a cache hit installs nothing; a cache
    # miss (or partial restore) installs only what's missing. Ncpus = 2
    # parallelises the install on GitHub's 2-core runners.
    - name: Install R packages
      shell: Rscript {0}
      run: |
        pkgs <- c(
          "testthat", "withr", "covr", "mockery", "R6", "yaml", "ggplot2",
          "roxygen2", "readxl", "knitr", "rmarkdown", "patchwork", "dplyr",
          "viridis", "ape", "caper", "phytools", "base64enc", "DBI",
          "RPostgres", "lintr", "styler", "rcmdcheck"
        )
        already <- rownames(installed.packages())
        to_install <- setdiff(pkgs, already)
        if (length(to_install) > 0) {
          message("Installing ", length(to_install), " packages: ",
                  paste(to_install, collapse = ", "))
          install.packages(to_install, repos = Sys.getenv("R_REPOS"), Ncpus = 2)
          message("Install complete.")
        } else {
          message("All ", length(pkgs), " packages already installed (cache hit).")
        }
