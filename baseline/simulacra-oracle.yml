# baseline/simulacra-oracle.yml — Ground truth for simulacrum parameter recovery
#
# These are KNOWN parameters we generate synthetic data from, not empirical results.
# The simulacrum must recover these within tolerance. The null control must NOT recover.

param_recovery:
  description: "Generate synthetic trait panel from threshold model, run PGLS, verify recovery"
  true_params:
    lambda: 0.15
    theta: 2.5
    m0: 10.0
    alpha: 0.05
  recovery:
    ci_level: 0.95           # recovered params must fall in 95% CI
    n_sims: 100
    seed: 42
  null_control:
    description: "Random parameters should NOT recover the true values"
    max_rho: 0.3

biphasic:
  description: "Generate synthetic genome reduction with known k1/k2, verify model selection"
  true_params:
    k1: 0.08
    k2: 0.004               # k1/k2 = 20.0
  model_selection:
    preferred: "logistic"
    min_delta_aicc: 4.0     # logistic must beat exponential by ΔAICc > 4
  seed: 42
  null_control:
    description: "Exponential model should NOT be preferred"
    max_delta_aicc: 2.0

cusp:
  description: "Generate synthetic system near known bifurcation, verify detection"
  true_params:
    bifurcation_point: 1.0
    control_var: 0.5
  detection:
    tolerance: 0.05
  seed: 42
  null_control:
    description: "System far from bifurcation should show no jump"

autocatalytic:
  description: "Generate synthetic innovation series with known closure"
  true_params:
    closure_threshold: 0.5
    innovation_rate: 0.3
  diversity_dependence:
    expected_sign: "positive"
  seed: 42
  null_control:
    description: "Non-autocatalytic data should show no diversity-dependence"

cross_kingdom:
  description: "Generate synthetic plant + bird data with shared slope"
  true_params:
    slope: 0.6
  transfer:
    min_bird_rho: 0.7       # bird ordering must correlate > 0.7 with true
    max_null_rho: 0.3       # random slope must NOT correlate > 0.3
  seed: 42
